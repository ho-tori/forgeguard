<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ForgeGuard Control Room</title>
  <style>
    :root { color-scheme: dark; --ink:#f5f1e8; --muted:#a8a39a; --panel:#171918; --line:#343934; --accent:#d6ff4b; --warn:#ffb347; --bad:#ff6b6b; }
    * { box-sizing:border-box; }
    body { margin:0; background:#0d0f0e; color:var(--ink); font:15px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace; }
    main { width:min(1040px,calc(100% - 32px)); margin:36px auto 80px; }
    header { display:flex; align-items:end; justify-content:space-between; gap:24px; border-bottom:1px solid var(--line); padding-bottom:18px; }
    h1 { margin:0; font-size:clamp(28px,5vw,54px); letter-spacing:-.06em; }
    h1 span { color:var(--accent); }
    .tag { color:var(--muted); text-align:right; }
    .grid { display:grid; grid-template-columns:1.35fr .65fr; gap:18px; margin-top:18px; }
    section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; }
    h2 { margin:0 0 14px; font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
    textarea,input { width:100%; color:var(--ink); background:#0d0f0e; border:1px solid var(--line); border-radius:8px; padding:12px; font:inherit; }
    textarea { min-height:180px; resize:vertical; }
    button { border:0; border-radius:7px; padding:10px 16px; background:var(--accent); color:#10120e; font:700 14px inherit; cursor:pointer; }
    button.secondary { background:#30352f; color:var(--ink); }
    button.danger { background:var(--bad); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .row { display:flex; gap:9px; margin-top:10px; flex-wrap:wrap; }
    .status { display:grid; gap:10px; }
    .metric { display:flex; justify-content:space-between; border-bottom:1px dotted var(--line); padding-bottom:7px; }
    .good { color:var(--accent); } .warning { color:var(--warn); }
    pre { min-height:150px; max-height:380px; overflow:auto; white-space:pre-wrap; word-break:break-word; background:#090b0a; padding:14px; border-radius:8px; color:#d8ddd5; }
    #approval { border-color:var(--warn); display:none; margin-top:18px; }
    label { display:block; margin:12px 0 5px; color:var(--muted); }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } header { align-items:start; flex-direction:column; } .tag { text-align:left; } }
  </style>
</head>
<body>
<main>
  <header><h1>FORGE<span>GUARD</span></h1><div class="tag">CODE AGENT / GOVERNED LOOP<br>LOCAL CONTROL ROOM</div></header>
  <div class="grid">
    <section>
      <h2>01 / Task</h2>
      <label for="task">给 agent 的编码任务</label>
      <textarea id="task" placeholder="例如：阅读 README，修复失败的单元测试，并在完成前运行 unit 检查。"></textarea>
      <div class="row"><button id="run">运行任务</button><button class="secondary" id="refresh">刷新状态</button></div>
      <h2 style="margin-top:24px">02 / Event result</h2>
      <pre id="output">等待任务。</pre>
    </section>
    <section>
      <h2>System status</h2>
      <div class="status">
        <div class="metric"><span>API credential</span><strong id="credential">—</strong></div>
        <div class="metric"><span>Audit chain</span><strong id="audit">—</strong></div>
      </div>
      <label for="admin-token">远程管理令牌（仅保存在当前页面内存）</label>
      <input id="admin-token" type="password" autocomplete="off" placeholder="本地监听无需填写">
      <label for="key">更新 API key（仅发送到当前服务）</label>
      <input id="key" type="password" autocomplete="new-password" placeholder="输入后不会回显">
      <div class="row"><button class="secondary" id="save-key">安全保存</button><button class="danger" id="clear-key">清除</button></div>
    </section>
  </div>
  <section id="approval">
    <h2>Human approval required</h2>
    <pre id="approval-detail"></pre>
    <div class="row"><button id="approve">批准一次</button><button class="danger" id="reject">拒绝并停止</button></div>
  </section>
</main>
<script>
const $ = id => document.getElementById(id); let pending = null;
async function api(path, options={}) { const token=$('admin-token').value; const headers={'Content-Type':'application/json'}; if(token)headers.Authorization=`Bearer ${token}`; const response = await fetch(path,{...options,headers:{...headers,...(options.headers||{})}}); const data=await response.json(); if(!response.ok) throw new Error(data.message||data.error_code); return data; }
function show(data){ $('output').textContent=JSON.stringify(data,null,2); pending=data.state==='awaiting_approval'?data:null; $('approval').style.display=pending?'block':'none'; if(pending)$('approval-detail').textContent=JSON.stringify(data.pending_action,null,2); }
async function status(){ try { const data=await api('/api/status'); $('credential').textContent=data.credential.configured?`configured / ${data.credential.source}`:'not configured'; $('credential').className=data.credential.configured?'good':'warning'; $('audit').textContent=data.audit.ok?`valid / ${data.audit.records} records`:`INVALID / ${data.audit.error}`; $('audit').className=data.audit.ok?'good':'warning'; } catch(error){ show({error:error.message}); } }
$('run').onclick=async()=>{ $('run').disabled=true; try{ show(await api('/api/run',{method:'POST',body:JSON.stringify({task:$('task').value})})); await status(); }catch(error){show({error:error.message});}finally{$('run').disabled=false;} };
$('refresh').onclick=status; $('admin-token').onchange=status;
$('save-key').onclick=async()=>{ try{ const data=await api('/api/credential',{method:'POST',body:JSON.stringify({api_key:$('key').value})}); $('key').value=''; show(data); await status(); }catch(error){show({error:error.message});} };
$('clear-key').onclick=async()=>{ try{ show(await api('/api/credential/clear',{method:'POST',body:'{}'})); await status(); }catch(error){show({error:error.message});} };
async function decide(approved){ if(!pending)return; try{ show(await api('/api/approval',{method:'POST',body:JSON.stringify({session_id:pending.session_id,approval_id:pending.approval_id,approved})})); await status(); }catch(error){show({error:error.message});} }
$('approve').onclick=()=>decide(true); $('reject').onclick=()=>decide(false); status();
</script>
</body>
</html>
